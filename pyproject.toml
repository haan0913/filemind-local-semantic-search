[project]
name = "filemind"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client>=1.10.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=4.0.0",
    "torch>=2.1.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "watchdog>=3.0.0",
    "pyyaml>=6.0",
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "extract-msg>=0.48.0",
    # Option B GUI API
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.scripts]
filemind = "run:main"

[project.optional-dependencies]
media = ["easyocr>=1.7", "open-clip-torch>=2.23", "faster-whisper>=0.10", "opencv-python>=4.9"]
agent = ["smolagents>=1.24.0"]
ui = ["textual>=0.47", "gradio>=6.0"]

[tool.setuptools]
py-modules = [
    "__init__", "__main__", "api", "catalog", "chunker", "classifier",
    "config", "dashboard", "duplicates", "embedder", "extractor",
    "nightly", "run", "scanner", "search", "vector_store", "verify",
    "bm25_index",
    "duplicates", "memmachine_sync",
]
